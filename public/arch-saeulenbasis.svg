<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" font-family="Georgia, serif">
  <!-- Background -->
  <rect width="420" height="480" fill="white"/>

  <!-- Foundation (Fundament) - hatched block -->
  <rect x="60" y="340" width="280" height="90" fill="white" stroke="#333" stroke-width="1.5"/>
  <!-- Hatching for foundation -->
  <line x1="60" y1="360" x2="120" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="60" y1="380" x2="150" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="60" y1="400" x2="180" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="60" y1="420" x2="210" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="70" y1="430" x2="240" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="100" y1="430" x2="270" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="130" y1="430" x2="300" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="160" y1="430" x2="330" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="190" y1="430" x2="340" y2="350" stroke="#333" stroke-width="0.8"/>
  <line x1="220" y1="430" x2="340" y2="370" stroke="#333" stroke-width="0.8"/>
  <line x1="250" y1="430" x2="340" y2="390" stroke="#333" stroke-width="0.8"/>
  <line x1="280" y1="430" x2="340" y2="410" stroke="#333" stroke-width="0.8"/>
  <line x1="310" y1="430" x2="340" y2="430" stroke="#333" stroke-width="0.8"/>

  <!-- Euthynterie (first course of Krepis) -->
  <rect x="75" y="310" width="270" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <!-- Stone joints in euthynterie -->
  <line x1="160" y1="310" x2="160" y2="340" stroke="#333" stroke-width="0.8"/>
  <line x1="245" y1="310" x2="245" y2="340" stroke="#333" stroke-width="0.8"/>

  <!-- Krepis step 2 -->
  <rect x="90" y="278" width="240" height="32" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <line x1="175" y1="278" x2="175" y2="310" stroke="#333" stroke-width="0.8"/>
  <line x1="255" y1="278" x2="255" y2="310" stroke="#333" stroke-width="0.8"/>

  <!-- Krepis step 3 -->
  <rect x="105" y="246" width="210" height="32" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <line x1="185" y1="246" x2="185" y2="278" stroke="#333" stroke-width="0.8"/>
  <line x1="265" y1="246" x2="265" y2="278" stroke="#333" stroke-width="0.8"/>

  <!-- Stylobat (top step) -->
  <rect x="118" y="210" width="184" height="36" fill="#e8e8e8" stroke="#333" stroke-width="2"/>

  <!-- Column flutes (vertical lines) -->
  <line x1="175" y1="40" x2="175" y2="210" stroke="#444" stroke-width="2"/>
  <line x1="183" y1="40" x2="183" y2="210" stroke="#444" stroke-width="1.5"/>
  <line x1="191" y1="40" x2="191" y2="210" stroke="#444" stroke-width="1.5"/>
  <line x1="199" y1="40" x2="199" y2="210" stroke="#444" stroke-width="1.5"/>
  <line x1="207" y1="40" x2="207" y2="210" stroke="#444" stroke-width="1.5"/>
  <line x1="215" y1="40" x2="215" y2="210" stroke="#444" stroke-width="1.5"/>
  <line x1="223" y1="40" x2="223" y2="210" stroke="#444" stroke-width="1.5"/>
  <line x1="231" y1="40" x2="231" y2="210" stroke="#444" stroke-width="2"/>

  <!-- ===== LABELS ===== -->

  <!-- Stylobat label -->
  <line x1="280" y1="228" x2="320" y2="185" stroke="#333" stroke-width="1"/>
  <text x="325" y="183" font-size="14" fill="#333" font-style="italic">Stylobat</text>

  <!-- Euthynterie label -->
  <line x1="90" y1="325" x2="50" y2="325" stroke="#333" stroke-width="1"/>
  <text x="4" y="329" font-size="11" fill="#333" font-style="italic">Euthynterie</text>

  <!-- Krepis bracket -->
  <line x1="55" y1="246" x2="40" y2="246" stroke="#333" stroke-width="1.2"/>
  <line x1="55" y1="340" x2="40" y2="340" stroke="#333" stroke-width="1.2"/>
  <line x1="40" y1="246" x2="40" y2="340" stroke="#333" stroke-width="1.2"/>
  <line x1="40" y1="293" x2="25" y2="293" stroke="#333" stroke-width="1"/>
  <text x="22" y="297" font-size="13" fill="#333" font-style="italic" text-anchor="end">Krepis</text>

  <!-- Fundament bracket -->
  <line x1="55" y1="340" x2="30" y2="340" stroke="#333" stroke-width="1.2"/>
  <line x1="55" y1="430" x2="30" y2="430" stroke="#333" stroke-width="1.2"/>
  <line x1="30" y1="340" x2="30" y2="430" stroke="#333" stroke-width="1.2"/>
  <line x1="30" y1="385" x2="12" y2="385" stroke="#333" stroke-width="1"/>
  <text x="10" y="389" font-size="13" fill="#333" font-style="italic" text-anchor="end">Fundament</text>

  <!-- Title -->
  <text x="210" y="465" font-size="12" fill="#555" text-anchor="middle" font-style="italic">Die dorische Bauordnung: Säulenbasis</text>
</svg>
